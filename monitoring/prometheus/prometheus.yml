global:
  scrape_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]
  
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]